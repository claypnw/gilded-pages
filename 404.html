<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Gilded Pages has moved</title>
<script>
  (function () {
    var prefix = "/gilded-pages";
    var path = window.location.pathname;
    if (path.indexOf(prefix) === 0) {
      path = path.slice(prefix.length);
    }
    if (path === "" || path === "/") {
      path = "/";
    }
    var target = "https://gilded-pages.pages.dev" + path + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://gilded-pages.pages.dev/">
</head>
<body>
<p>The Gilded Pages has moved. You are being taken to its new home:
<a href="https://gilded-pages.pages.dev/">gilded-pages.pages.dev</a></p>
</body>
</html>
