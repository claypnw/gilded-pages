<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="apple-touch-icon" href="icon.jpg" />
    <title>The Gilded Pages of the Holds</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3eee3;
        --paper-deep: #e9dfc9;
        --paper-edge: #d9c9a8;
        --card: #f7f1e4;
        --card-line: #8f8068;
        --ink: #211e19;
        --ink-soft: #6b6257;
        --accent: #b54f24;
        --accent-deep: #542d1b;
        --gold: #b54f24;
        --quote-bg: #efe6d0;
        --shadow: rgba(33, 30, 25, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #151817;
          --paper-deep: #101312;
          --paper-edge: #080a09;
          --card: #202321;
          --card-line: #57503f;
          --ink: #f2ecdf;
          --ink-soft: #c8c0b2;
          --accent: #db7040;
          --accent-deep: #e8b64c;
          --gold: #e8b64c;
          --quote-bg: #2a241d;
          --shadow: rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Source Sans 3", "Trebuchet MS", sans-serif;
        font-size: 17px;
        line-height: 1.55;
        background:
          radial-gradient(ellipse 60% 40% at 12% 8%, rgba(181, 79, 36, 0.14), transparent 70%),
          radial-gradient(ellipse 50% 35% at 88% 22%, rgba(143, 128, 104, 0.14), transparent 70%),
          radial-gradient(ellipse 70% 50% at 50% 95%, rgba(84, 45, 27, 0.10), transparent 70%),
          linear-gradient(160deg, var(--paper) 0%, var(--paper-deep) 55%, var(--paper) 100%);
        background-color: var(--paper);
        min-height: 100vh;
      }
      .fell { font-family: "Alegreya SC", Georgia, serif; }
      .fell-sc { font-family: "Alegreya SC", Georgia, serif; }
      a { color: var(--accent); }
      a:hover { color: var(--accent-deep); }

      .wrap { max-width: 1060px; margin: 0 auto; padding: 0 18px 56px; }

      /* ---------- page header band ---------- */
      .masthead {
        border-bottom: 3px double var(--ink);
        padding: 30px 0 18px;
        margin-bottom: 8px;
      }
      .masthead .rule-top {
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        height: 4px;
        margin-bottom: 20px;
        opacity: 0.65;
      }
      .menu-back {
        position: absolute; top: 12px; left: 12px; z-index: 50;
        display: inline-block; padding: 10px 16px;
        color: #e8b64c; background: rgba(24,15,9,.85);
        border: 2px solid #8f8068; border-radius: 10px;
        font-family: "Alegreya SC", Georgia, serif; font-size: 18px;
        letter-spacing: 0.04em; text-decoration: none;
      }
      .dir-title {
        font-size: clamp(34px, 6.5vw, 58px);
        line-height: 1.05;
        margin: 0 0 6px;
        letter-spacing: 0.01em;
      }
      .dir-sub {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: italic;
        font-size: clamp(17px, 2.6vw, 21px);
        color: var(--ink-soft);
        margin: 0 0 14px;
        max-width: 62ch;
      }
      .masthead-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      /* ---------- category thumb tabs ---------- */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0 6px;
        padding: 0;
        list-style: none;
      }
      .tabs a {
        display: inline-block;
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 15px;
        text-decoration: none;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--card-line);
        border-bottom: 3px solid var(--accent);
        padding: 6px 12px 5px;
      }
      .tabs a:hover { background: var(--quote-bg); color: var(--accent-deep); }

      /* ---------- category sections ---------- */
      .cat-section { margin-top: 42px; scroll-margin-top: 18px; }
      .cat-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 6px;
        flex-wrap: wrap;
      }
      .cat-head h2 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(24px, 4vw, 32px);
        margin: 0;
      }
      .cat-gloss { font-style: italic; color: var(--ink-soft); font-size: 15.5px; }
      .subcat { margin-top: 34px; scroll-margin-top: 18px; }
      .subcat-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        border-bottom: 1px solid var(--ink-soft);
        padding-bottom: 4px;
        flex-wrap: wrap;
      }
      .subcat-head h3 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(20px, 3.2vw, 26px);
        margin: 0;
      }

      .vendor-list { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 20px; }
      @media (min-width: 760px) { .vendor-list { grid-template-columns: 1fr 1fr; } }

      .card {
        background: var(--card);
        border: 1px solid var(--card-line);
        box-shadow: 2px 3px 0 var(--shadow);
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card img.thumb {
        width: 100%;
        aspect-ratio: 3 / 2;
        height: auto;
        display: block;
        border-bottom: 1px solid var(--card-line);
        filter: sepia(0.25) saturate(0.85);
      }
      .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .card h3 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: 25px;
        line-height: 1.15;
        margin: 0;
      }
      .card h3 a { color: var(--ink); text-decoration: none; }
      .card h3 a:hover { color: var(--accent-deep); text-decoration: underline; }
      .card .meta {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.03em;
        color: var(--accent-deep);
      }
      .card .teaser { margin: 0; font-size: 15.5px; color: var(--ink); }
      .card .card-foot {
        margin-top: auto;
        padding-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px dotted var(--card-line);
      }
      .featured-line { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }
      .checked-line {
        margin: 2px 0 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--ink);
        letter-spacing: 0.02em;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        border-left: 3px solid var(--accent);
        padding: 6px 10px;
        flex: 0 0 auto;
      }
      .checked-line .cl-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 13.5px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }
      .open-link {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 15px;
        text-decoration: none;
        white-space: nowrap;
      }
      .open-link:hover { text-decoration: underline; }

      /* ---------- vendor page ---------- */
      .crumbs {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 14px;
      }
      .crumbs a { text-decoration: none; }
      .crumbs a:hover { text-decoration: underline; }
      .crumbs .sep { color: var(--ink-soft); }
      .vendor-head { border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 24px; }
      .vendor-head .dir-small {
        font-family: "Alegreya SC", Georgia, serif;
        letter-spacing: 0.06em;
        font-size: 14px;
        color: var(--ink-soft);
        margin: 0 0 8px;
      }
      .vendor-head h1 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(32px, 6vw, 50px);
        line-height: 1.08;
        margin: 0 0 8px;
      }
      .vendor-head .meta-line {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: clamp(16px, 2.6vw, 19px);
        color: var(--accent-deep);
        margin: 0;
      }
      .vendor-grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
      @media (min-width: 820px) {
        .vendor-grid { grid-template-columns: 1.15fr 1fr; gap: 34px; align-items: start; }
      }
      figure.engraving { margin: 0 auto 26px; max-width: 880px; }
      figure.engraving img {
        width: 100%;
        display: block;
        border: 1px solid var(--card-line);
        box-shadow: 3px 4px 0 var(--shadow);
        filter: sepia(0.22) saturate(0.85);
        background: var(--card);
      }
      figure.engraving figcaption {
        font-style: italic;
        font-size: 14.5px;
        color: var(--ink-soft);
        margin-top: 9px;
        text-align: center;
      }
      .blurb { font-size: 17.5px; }
      .blurb p { margin: 0 0 14px; }

      /* vendor page section labels: the scroll version & the fuller tale */
      .sec-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 21px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        margin: 0 0 3px;
      }
      .sec-cite {
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      .sec-cite a { color: var(--accent-deep); }
      .heraldry .hb-sub {
        display: block;
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        margin-bottom: 9px;
      }
      .blurb p:first-of-type::first-letter {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 2.6em;
        float: left;
        line-height: 0.85;
        padding: 4px 8px 0 0;
        color: var(--accent-deep);
      }
      blockquote.review {
        margin: 22px 0;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        padding: 16px 20px 14px;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      blockquote.review .rq {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: italic;
        font-size: 19px;
        line-height: 1.45;
        margin: 0 0 8px;
      }
      blockquote.review .rs { font-size: 14.5px; color: var(--ink-soft); margin: 0; }

      .why-box {
        border: 1px solid var(--card-line);
        border-top: 3px solid var(--gold);
        background: var(--card);
        padding: 15px 18px 13px;
        margin: 22px 0;
      }
      .why-box .wb-title {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 5px;
      }
      .why-box p { margin: 0; font-size: 16.5px; }

      /* from their own heraldry */
      .heraldry {
        border: 1px solid var(--card-line);
        border-top: 3px solid var(--accent);
        background: var(--card);
        padding: 15px 18px 13px;
        margin: 22px 0;
      }
      .heraldry .hb-title {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 5px;
      }
      .heraldry p { margin: 0 0 10px; font-size: 16.5px; }
      .heraldry p:last-child { margin-bottom: 0; }
      .heraldry .if-you-go { font-style: italic; }
      .heraldry .if-you-go .iyg-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: normal;
        color: var(--accent-deep);
      }
      .heraldry .src { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }

      /* the scroll confesses */
      .confession {
        border: 1px dashed var(--card-line);
        background: var(--quote-bg);
        padding: 11px 16px 10px;
        margin: 18px 0 4px;
        font-size: 15.5px;
        font-style: italic;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      .confession .cf-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: normal;
        font-size: 14.5px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }

      /* ---------- mail order skyrim (pure jest) ---------- */
      .fiction-section {
        margin-top: 64px;
        border-top: 3px double var(--ink);
        padding-top: 26px;
        scroll-margin-top: 18px;
      }
      .fiction-head { text-align: center; margin-bottom: 24px; }
      .fiction-kicker {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 14px;
        letter-spacing: 0.09em;
        color: var(--gold);
        display: block;
      }
      .fiction-head h2 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(30px, 5.5vw, 46px);
        margin: 4px 0 12px;
      }
      .jest-label {
        display: inline-block;
        border: 2px dashed var(--gold);
        background: var(--quote-bg);
        padding: 8px 18px;
        font-style: italic;
        font-size: 15.5px;
        box-shadow: 2px 3px 0 var(--shadow);
        max-width: 70ch;
      }
      .fiction-intro { max-width: 68ch; margin: 14px auto 0; font-size: 16px; text-align: left; }
      .jest-banner {
        border: 2px dashed var(--gold);
        background: var(--quote-bg);
        padding: 10px 18px;
        text-align: center;
        font-style: italic;
        font-size: 16px;
        box-shadow: 2px 3px 0 var(--shadow);
        margin-bottom: 24px;
      }
      .jest-banner .jb-title {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: normal;
        letter-spacing: 0.06em;
        color: var(--gold);
        display: block;
        font-size: 15px;
        margin-bottom: 2px;
      }
      .card.jest {
        border: 1px dashed var(--gold);
        background: var(--quote-bg);
        position: relative;
      }
      .jest-ribbon {
        position: absolute;
        top: 20px;
        right: -38px;
        transform: rotate(38deg);
        background: var(--card);
        border-top: 1.5px solid var(--gold);
        border-bottom: 1.5px solid var(--gold);
        color: var(--gold);
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 13px;
        letter-spacing: 0.14em;
        padding: 4px 44px;
        z-index: 2;
        box-shadow: 0 2px 4px var(--shadow);
      }
      .card.jest .meta { color: var(--gold); }
      .fiction-note {
        margin-top: 20px;
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        text-align: center;
      }

      /* sweetroll watch */
      .sweetroll-watch {
        margin: 18px 0 4px;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        border-left: 4px solid var(--gold);
        padding: 12px 16px 11px;
        font-size: 15.5px;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      .sweetroll-watch .sw-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.05em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 3px;
      }
      .sweetroll-watch p { margin: 0; font-style: italic; }
      .card .sw-line {
        margin: 0;
        font-size: 14px;
        font-style: italic;
        color: var(--ink-soft);
        border-left: 3px solid var(--gold);
        background: var(--quote-bg);
        padding: 7px 10px;
      }
      .card .sw-line .sw-label {
        font-family: "Alegreya SC", Georgia, serif;
        font-style: normal;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }

      /* directory facts table */
      .facts { margin: 6px 0 0; border-top: 1px solid var(--card-line); }
      .facts .row {
        display: grid;
        grid-template-columns: 118px 1fr;
        gap: 10px;
        padding: 8px 2px;
        border-bottom: 1px solid var(--card-line);
        font-size: 15.5px;
      }
      .facts dt {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.03em;
        color: var(--accent-deep);
        padding-top: 1px;
      }
      .facts dd { margin: 0; }
      .facts .row.wide { grid-template-columns: 198px 1fr; }
      @media (max-width: 560px) { .facts .row.wide { grid-template-columns: 148px 1fr; } }

      /* ---------- trailer / footer ---------- */
      .trailer {
        margin-top: 46px;
        border-top: 3px double var(--ink);
        padding-top: 18px;
      }
      .trailer .tr-title {
        font-family: "Alegreya SC", Georgia, serif;
        font-size: 18px;
        letter-spacing: 0.03em;
        margin: 0 0 12px;
        color: var(--accent-deep);
      }
      .trailer-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
      @media (min-width: 760px) { .trailer-grid { grid-template-columns: repeat(3, 1fr); } }
      .trailer h4 {
        font-family: "Alegreya SC", Georgia, serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        margin: 0 0 6px;
        border-bottom: 1px solid var(--card-line);
        padding-bottom: 4px;
      }
      .trailer ul { list-style: none; margin: 0; padding: 0; font-size: 15px; }
      .trailer li { margin: 0 0 5px; }
      .trailer p { font-size: 15px; margin: 0 0 10px; max-width: 78ch; }
      .colophon {
        margin-top: 22px;
        text-align: center;
        font-style: italic;
        color: var(--ink-soft);
        font-size: 14px;
        border-top: 1px solid var(--card-line);
        padding-top: 12px;
      }
      .back-top { display: inline-block; margin-top: 14px; font-family: "Alegreya SC", Georgia, serif; font-size: 15px; text-decoration: none; }
      .back-top:hover { text-decoration: underline; }
      .back-page1-wrap { text-align: center; margin: 30px 0 12px; }
      .back-page1-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; font-family: "Alegreya SC", Georgia, serif; font-size: 19px; letter-spacing: 0.05em; color: var(--accent-deep); background:
          radial-gradient(ellipse 70% 50% at 18% 20%, rgba(181, 79, 36, 0.10), transparent 60%),
          radial-gradient(ellipse 60% 45% at 82% 80%, rgba(181, 79, 36, 0.10), transparent 65%),
          linear-gradient(165deg, var(--card) 0%, var(--quote-bg) 55%, var(--card) 100%);
        border: 2px solid var(--accent-deep); outline: 1px solid var(--card-line); outline-offset: 3px;
        padding: 13px 34px; text-decoration: none; box-shadow: 2px 3px 0 var(--shadow), inset 0 0 0 1px rgba(181, 79, 36, 0.18); border-radius: 2px; }
      .back-page1-btn::before, .back-page1-btn::after { content: "\2022"; position: absolute; top: 50%; transform: translateY(-52%); font-size: 13px; color: var(--gold); opacity: 0.85; }
      .back-page1-btn::before { left: 11px; }
      .back-page1-btn::after { right: 11px; }
      .back-page1-btn:hover { color: var(--accent); background:
          radial-gradient(ellipse 70% 50% at 18% 20%, rgba(181, 79, 36, 0.14), transparent 60%),
          linear-gradient(165deg, var(--quote-bg) 0%, var(--card) 60%, var(--quote-bg) 100%); }
      .back-page1-btn:active { transform: translateY(1px); box-shadow: 1px 2px 0 var(--shadow), inset 0 0 0 1px rgba(181, 79, 36, 0.18); }
      [hidden] { display: none !important; }
    
      .lede { font-size: 1.12em; font-style: italic; margin: 0 0 18px; }
      .no-web { font-style: italic; opacity: .9; margin: 6px 0 0; }
      .facts.hold-facts { margin-left: 26px; }
      .card.big h3 { font-size: 1.25em; }
    </style>
  </head>
  <body>
    <a class="menu-back" href="https://claypnw.github.io/menu/hearth-menu.html">← Menu</a>
    <div class="wrap" id="app"></div>
    <noscript><p style="padding:20px">The Gilded Pages needs JavaScript to open its leaves.</p></noscript>
    <script>
    var ARCHIVE_URL = "https://claypnw.github.io/morning-scroll/";
    var LAST_CHECKED = "September 30, 2026";

    var CATEGORIES = [
      { id: "feasts",     name: "Feasts & Morning Boards",              gloss: "Diners, cafés & restaurants" },
      { id: "wake",       name: "Wake-Potions & Coffee Houses",         gloss: "Coffee shops & espresso" },
      { id: "sweetrolls", name: "Sweetrolls, Bakeries & Market Stalls", gloss: "Bakeries, donuts & food markets" },
      { id: "meadhalls",  name: "Mead Halls, Ales & Pub Fare",          gloss: "Breweries & pubs" },

        window.scrollTo(0, 0);

    document.addEventListener("click", function (e) {

          return;
        }
        t = t.parentNode;
      }
    });

  for(var j=0;j<links.length;j++){
    var a=links[j];
    if(a.classList&&a.classList.contains("menu-back"))continue;
    var h=a.getAttribute("href");
    if(!h||h.charAt(0)==="#")continue;
    if(/\.pdf($|\?)/i.test(h))continue;
    if(/^https?:\/\//i.test(h)&&h.indexOf("claypnw.github.io")<0)continue;
    if(!/(\.html|\/)([?#]|$)/.test(h))continue;
    if(/[?&]from=/.test(h))continue;
    a.setAttribute("href",h+(h.indexOf("?")<0?"?":"&")+"from="+from);
  }
})();
</script>
</body>
</html>
