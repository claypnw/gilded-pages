<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/jpeg" href="icon.jpg" />
  <link rel="apple-touch-icon" href="icon.jpg" />
    <title>The Gilded Pages of the Holds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #dfe5cb;
        --paper-deep: #cdd7ae;
        --paper-edge: #b9c695;
        --card: #eef1dc;
        --card-line: #9aa87c;
        --ink: #2b331f;
        --ink-soft: #525f3c;
        --accent: #33604a;
        --accent-deep: #224433;
        --gold: #8f6d1f;
        --quote-bg: #e4ebcd;
        --shadow: rgba(43, 51, 31, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #171f11;
          --paper-deep: #111809;
          --paper-edge: #0b1006;
          --card: #202b17;
          --card-line: #44562f;
          --ink: #e4ebd0;
          --ink-soft: #aabd8e;
          --accent: #93c7a4;
          --accent-deep: #b7dcc2;
          --gold: #cda64e;
          --quote-bg: #243118;
          --shadow: rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.55;
        background:
          radial-gradient(ellipse 60% 40% at 12% 8%, rgba(120, 140, 80, 0.20), transparent 70%),
          radial-gradient(ellipse 50% 35% at 88% 22%, rgba(90, 115, 60, 0.18), transparent 70%),
          radial-gradient(ellipse 70% 50% at 50% 95%, rgba(100, 125, 70, 0.16), transparent 70%),
          linear-gradient(160deg, var(--paper) 0%, var(--paper-deep) 55%, var(--paper) 100%);
        background-color: var(--paper);
        min-height: 100vh;
      }
      .fell { font-family: "IM Fell English", Georgia, serif; }
      .fell-sc { font-family: "IM Fell English SC", "IM Fell English", Georgia, serif; }
      a { color: var(--accent); }
      a:hover { color: var(--accent-deep); }

      .wrap { max-width: 1060px; margin: 0 auto; padding: 0 18px 56px; }

      /* ---------- page header band ---------- */
      .masthead {
        border-bottom: 3px double var(--ink);
        padding: 30px 0 18px;
        margin-bottom: 8px;
      }
      .masthead .rule-top {
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        height: 4px;
        margin-bottom: 20px;
        opacity: 0.65;
      }
      .dir-title {
        font-size: clamp(34px, 6.5vw, 58px);
        line-height: 1.05;
        margin: 0 0 6px;
        letter-spacing: 0.01em;
      }
      .dir-sub {
        font-family: "IM Fell English", Georgia, serif;
        font-style: italic;
        font-size: clamp(17px, 2.6vw, 21px);
        color: var(--ink-soft);
        margin: 0 0 14px;
        max-width: 62ch;
      }
      .masthead-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .green-note {
        border: 1px solid var(--card-line);
        background: var(--card);
        padding: 12px 16px 13px;
        font-size: 15px;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      .green-note .gn-title {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        display: block;
        margin-bottom: 4px;
        color: var(--accent-deep);
      }
      .green-note p { margin: 0; }
      .green-note.interlude { margin-top: 48px; }

      /* ---------- category thumb tabs ---------- */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0 6px;
        padding: 0;
        list-style: none;
      }
      .tabs a {
        display: inline-block;
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 15px;
        text-decoration: none;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--card-line);
        border-bottom: 3px solid var(--accent);
        padding: 6px 12px 5px;
      }
      .tabs a:hover { background: var(--quote-bg); color: var(--accent-deep); }

      /* ---------- category sections ---------- */
      .cat-section { margin-top: 42px; scroll-margin-top: 18px; }
      .cat-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 6px;
        flex-wrap: wrap;
      }
      .cat-head h2 {
        font-family: "IM Fell English SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(24px, 4vw, 32px);
        margin: 0;
      }
      .cat-gloss { font-style: italic; color: var(--ink-soft); font-size: 15.5px; }

      .vendor-list { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 20px; }
      @media (min-width: 760px) { .vendor-list { grid-template-columns: 1fr 1fr; } }

      .card {
        background: var(--card);
        border: 1px solid var(--card-line);
        box-shadow: 2px 3px 0 var(--shadow);
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card img.thumb {
        width: 100%;
        height: auto;
        display: block;
        border-bottom: 1px solid var(--card-line);
        filter: sepia(0.25) saturate(0.85);
      }
      .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .card h3 {
        font-family: "IM Fell English", Georgia, serif;
        font-weight: 400;
        font-size: 25px;
        line-height: 1.15;
        margin: 0;
      }
      .card h3 a { color: var(--ink); text-decoration: none; }
      .card h3 a:hover { color: var(--accent-deep); text-decoration: underline; }
      .card .meta {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.03em;
        color: var(--accent-deep);
      }
      .card .teaser { margin: 0; font-size: 15.5px; color: var(--ink); }
      .card .card-foot {
        margin-top: auto;
        padding-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px dotted var(--card-line);
      }
      .featured-line { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }
      .checked-line {
        margin: 2px 0 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--ink);
        letter-spacing: 0.02em;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        border-left: 3px solid var(--accent);
        padding: 6px 10px;
        flex: 0 0 auto;
      }
      .checked-line .cl-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 13.5px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }
      .open-link {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 15px;
        text-decoration: none;
        white-space: nowrap;
      }
      .open-link:hover { text-decoration: underline; }

      /* ---------- vendor page ---------- */
      .crumbs {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 14px;
      }
      .crumbs a { text-decoration: none; }
      .crumbs a:hover { text-decoration: underline; }
      .crumbs .sep { color: var(--ink-soft); }
      .vendor-head { border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 24px; }
      .vendor-head .dir-small {
        font-family: "IM Fell English SC", Georgia, serif;
        letter-spacing: 0.06em;
        font-size: 14px;
        color: var(--ink-soft);
        margin: 0 0 8px;
      }
      .vendor-head h1 {
        font-family: "IM Fell English", Georgia, serif;
        font-weight: 400;
        font-size: clamp(32px, 6vw, 50px);
        line-height: 1.08;
        margin: 0 0 8px;
      }
      .vendor-head .meta-line {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: clamp(16px, 2.6vw, 19px);
        color: var(--accent-deep);
        margin: 0;
      }
      .vendor-grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
      @media (min-width: 820px) {
        .vendor-grid { grid-template-columns: 1.15fr 1fr; gap: 34px; align-items: start; }
      }
      figure.engraving { margin: 0 auto 26px; max-width: 880px; }
      figure.engraving img {
        width: 100%;
        display: block;
        border: 1px solid var(--card-line);
        box-shadow: 3px 4px 0 var(--shadow);
        filter: sepia(0.22) saturate(0.85);
        background: var(--card);
      }
      figure.engraving figcaption {
        font-style: italic;
        font-size: 14.5px;
        color: var(--ink-soft);
        margin-top: 9px;
        text-align: center;
      }
      .blurb { font-size: 17.5px; }
      .blurb p { margin: 0 0 14px; }

      /* vendor page section labels: the scroll version & the fuller tale */
      .sec-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 21px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        margin: 0 0 3px;
      }
      .sec-cite {
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      .sec-cite a { color: var(--accent-deep); }
      .heraldry .hb-sub {
        display: block;
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        margin-bottom: 9px;
      }
      .blurb p:first-of-type::first-letter {
        font-family: "IM Fell English", Georgia, serif;
        font-size: 2.6em;
        float: left;
        line-height: 0.85;
        padding: 4px 8px 0 0;
        color: var(--accent-deep);
      }
      blockquote.review {
        margin: 22px 0;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        padding: 16px 20px 14px;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      blockquote.review .rq {
        font-family: "IM Fell English", Georgia, serif;
        font-style: italic;
        font-size: 19px;
        line-height: 1.45;
        margin: 0 0 8px;
      }
      blockquote.review .rs { font-size: 14.5px; color: var(--ink-soft); margin: 0; }

      .why-box {
        border: 1px solid var(--card-line);
        border-top: 3px solid var(--gold);
        background: var(--card);
        padding: 15px 18px 13px;
        margin: 22px 0;
      }
      .why-box .wb-title {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 5px;
      }
      .why-box p { margin: 0; font-size: 16.5px; }

      /* from their own heraldry */
      .heraldry {
        border: 1px solid var(--card-line);
        border-top: 3px solid var(--accent);
        background: var(--card);
        padding: 15px 18px 13px;
        margin: 22px 0;
      }
      .heraldry .hb-title {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 5px;
      }
      .heraldry p { margin: 0 0 10px; font-size: 16.5px; }
      .heraldry p:last-child { margin-bottom: 0; }
      .heraldry .if-you-go { font-style: italic; }
      .heraldry .if-you-go .iyg-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-style: normal;
        color: var(--accent-deep);
      }
      .heraldry .src { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }

      /* the scroll confesses */
      .confession {
        border: 1px dashed var(--card-line);
        background: var(--quote-bg);
        padding: 11px 16px 10px;
        margin: 18px 0 4px;
        font-size: 15.5px;
        font-style: italic;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      .confession .cf-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-style: normal;
        font-size: 14.5px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }

      /* ---------- mail order skyrim (pure jest) ---------- */
      .fiction-section {
        margin-top: 64px;
        border-top: 3px double var(--ink);
        padding-top: 26px;
        scroll-margin-top: 18px;
      }
      .fiction-head { text-align: center; margin-bottom: 24px; }
      .fiction-kicker {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 14px;
        letter-spacing: 0.09em;
        color: var(--gold);
        display: block;
      }
      .fiction-head h2 {
        font-family: "IM Fell English SC", Georgia, serif;
        font-weight: 400;
        font-size: clamp(30px, 5.5vw, 46px);
        margin: 4px 0 12px;
      }
      .jest-label {
        display: inline-block;
        border: 2px dashed var(--gold);
        background: var(--quote-bg);
        padding: 8px 18px;
        font-style: italic;
        font-size: 15.5px;
        box-shadow: 2px 3px 0 var(--shadow);
        max-width: 70ch;
      }
      .fiction-intro { max-width: 68ch; margin: 14px auto 0; font-size: 16px; text-align: left; }
      .jest-banner {
        border: 2px dashed var(--gold);
        background: var(--quote-bg);
        padding: 10px 18px;
        text-align: center;
        font-style: italic;
        font-size: 16px;
        box-shadow: 2px 3px 0 var(--shadow);
        margin-bottom: 24px;
      }
      .jest-banner .jb-title {
        font-family: "IM Fell English SC", Georgia, serif;
        font-style: normal;
        letter-spacing: 0.06em;
        color: var(--gold);
        display: block;
        font-size: 15px;
        margin-bottom: 2px;
      }
      .card.jest {
        border: 1px dashed var(--gold);
        background: var(--quote-bg);
        position: relative;
      }
      .jest-ribbon {
        position: absolute;
        top: 20px;
        right: -38px;
        transform: rotate(38deg);
        background: var(--card);
        border-top: 1.5px solid var(--gold);
        border-bottom: 1.5px solid var(--gold);
        color: var(--gold);
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 13px;
        letter-spacing: 0.14em;
        padding: 4px 44px;
        z-index: 2;
        box-shadow: 0 2px 4px var(--shadow);
      }
      .card.jest .meta { color: var(--gold); }
      .fiction-note {
        margin-top: 20px;
        font-size: 14.5px;
        font-style: italic;
        color: var(--ink-soft);
        text-align: center;
      }

      /* sweetroll watch */
      .sweetroll-watch {
        margin: 18px 0 4px;
        background: var(--quote-bg);
        border: 1px solid var(--card-line);
        border-left: 4px solid var(--gold);
        padding: 12px 16px 11px;
        font-size: 15.5px;
        box-shadow: 2px 3px 0 var(--shadow);
      }
      .sweetroll-watch .sw-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.05em;
        color: var(--accent-deep);
        display: block;
        margin-bottom: 3px;
      }
      .sweetroll-watch p { margin: 0; font-style: italic; }
      .card .sw-line {
        margin: 0;
        font-size: 14px;
        font-style: italic;
        color: var(--ink-soft);
        border-left: 3px solid var(--gold);
        background: var(--quote-bg);
        padding: 7px 10px;
      }
      .card .sw-line .sw-label {
        font-family: "IM Fell English SC", Georgia, serif;
        font-style: normal;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--accent-deep);
      }

      /* directory facts table */
      .facts { margin: 6px 0 0; border-top: 1px solid var(--card-line); }
      .facts .row {
        display: grid;
        grid-template-columns: 118px 1fr;
        gap: 10px;
        padding: 8px 2px;
        border-bottom: 1px solid var(--card-line);
        font-size: 15.5px;
      }
      .facts dt {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 14.5px;
        letter-spacing: 0.03em;
        color: var(--accent-deep);
        padding-top: 1px;
      }
      .facts dd { margin: 0; }
      .facts .row.wide { grid-template-columns: 198px 1fr; }
      @media (max-width: 560px) { .facts .row.wide { grid-template-columns: 148px 1fr; } }

      /* ---------- trailer / footer ---------- */
      .trailer {
        margin-top: 46px;
        border-top: 3px double var(--ink);
        padding-top: 18px;
      }
      .trailer .tr-title {
        font-family: "IM Fell English SC", Georgia, serif;
        font-size: 18px;
        letter-spacing: 0.03em;
        margin: 0 0 12px;
        color: var(--accent-deep);
      }
      .trailer-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
      @media (min-width: 760px) { .trailer-grid { grid-template-columns: repeat(3, 1fr); } }
      .trailer h4 {
        font-family: "IM Fell English SC", Georgia, serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        margin: 0 0 6px;
        border-bottom: 1px solid var(--card-line);
        padding-bottom: 4px;
      }
      .trailer ul { list-style: none; margin: 0; padding: 0; font-size: 15px; }
      .trailer li { margin: 0 0 5px; }
      .trailer p { font-size: 15px; margin: 0 0 10px; max-width: 78ch; }
      .colophon {
        margin-top: 22px;
        text-align: center;
        font-style: italic;
        color: var(--ink-soft);
        font-size: 14px;
        border-top: 1px solid var(--card-line);
        padding-top: 12px;
      }
      .back-top { display: inline-block; margin-top: 14px; font-family: "IM Fell English SC", Georgia, serif; font-size: 15px; text-decoration: none; }
      .back-top:hover { text-decoration: underline; }
      .back-page1-wrap { text-align: center; margin: 30px 0 12px; }
      .back-page1-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; font-family: "IM Fell English SC", Georgia, serif; font-size: 19px; letter-spacing: 0.05em; color: var(--accent-deep); background:
          radial-gradient(ellipse 70% 50% at 18% 20%, rgba(143, 109, 31, 0.10), transparent 60%),
          radial-gradient(ellipse 60% 45% at 82% 80%, rgba(51, 96, 74, 0.10), transparent 65%),
          linear-gradient(165deg, var(--card) 0%, var(--quote-bg) 55%, var(--card) 100%);
        border: 2px solid var(--accent-deep); outline: 1px solid var(--card-line); outline-offset: 3px;
        padding: 13px 34px; text-decoration: none; box-shadow: 2px 3px 0 var(--shadow), inset 0 0 0 1px rgba(143, 109, 31, 0.18); border-radius: 2px; }
      .back-page1-btn::before, .back-page1-btn::after { content: "\2022"; position: absolute; top: 50%; transform: translateY(-52%); font-size: 13px; color: var(--gold); opacity: 0.85; }
      .back-page1-btn::before { left: 11px; }
      .back-page1-btn::after { right: 11px; }
      .back-page1-btn:hover { color: var(--accent); background:
          radial-gradient(ellipse 70% 50% at 18% 20%, rgba(143, 109, 31, 0.14), transparent 60%),
          linear-gradient(165deg, var(--quote-bg) 0%, var(--card) 60%, var(--quote-bg) 100%); }
      .back-page1-btn:active { transform: translateY(1px); box-shadow: 1px 2px 0 var(--shadow), inset 0 0 0 1px rgba(143, 109, 31, 0.18); }
      [hidden] { display: none !important; }
    
      .big-locs { margin: 6px 0 0; display: flex; flex-direction: column; gap: 10px; }
      .big-loc { border-top: 1px dashed var(--card-line); padding-top: 8px; }
      .big-loc dt { font-weight: bold; }
      .big-loc dd { margin: 2px 0 0; }
      .big-note { font-style: italic; opacity: .85; }
      .card.big h3 { font-size: 1.25em; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <noscript><p style="padding:20px">The Gilded Pages needs JavaScript to open its leaves.</p></noscript>
    <script>
    var ARCHIVE_URL = "https://claypnw.github.io/morning-scroll/";
    var LAST_CHECKED = "September 30, 2026";

    var CATEGORIES = [
      { id: "feasts",     name: "Feasts & Morning Boards",              gloss: "Diners, cafés & restaurants" },
      { id: "wake",       name: "Wake-Potions & Coffee Houses",         gloss: "Coffee shops & espresso" },
      { id: "sweetrolls", name: "Sweetrolls, Bakeries & Market Stalls", gloss: "Bakeries, donuts & food markets" },
      { id: "meadhalls",  name: "Mead Halls, Ales & Pub Fare",          gloss: "Breweries & pubs" },
      { id: "relics",     name: "Relics, Antiques & Secondhand Treasures", gloss: "Thrift & antique shops" },
      { id: "smiths",     name: "Smiths, Hardware & Maker Supply",      gloss: "Hardware, tools & build supplies" },
      { id: "outfitters", name: "Outfitters, Trail Gear & Rentals",     gloss: "Outdoor shops & gear rentals" }
    ];

/* Big-store directory entries for The Gilded Pages — built 2026-10-03.
   Each entry: one old-timey intro line (Skyrim bend, light & fun), an engraving,
   and plain practical facts per Hold location. No Scroll citation, no reviews. */

var BIG_CATEGORIES = [
  { id: "larders", name: "Larders & Provisions", gloss: "Groceries, warehouse & general stores" },
  { id: "inns",    name: "Inns & Lodging", gloss: "Hotels, motels, resorts & RV parks" },
  { id: "wheels",  name: "Wheels & Road Services", gloss: "Auto parts, dealers, towing & taxi" },
  { id: "town",    name: "Town Services", gloss: "Veterinary, grooming & storage" }

      h += '<div><h4>Finding a merchant</h4><p>Merchants are enrolled by trade, not by name — feast-halls with feast-halls, smiths with smiths. Use the trade tabs at the top of this page to jump straight to a section, then open any merchant\u2019s own page for the full entry.</p></div>';
      h += '<div><h4>On each merchant\u2019s page</h4><p>The full write-up exactly as The Payson Morning Scroll printed it, the engraver\u2019s likeness, a traveler\u2019s review in their own words, and the practical ledger: address, phone, hours, prices, website, and one good thing to know before you set out.</p></div>';
      h += '<div><h4>Kept current</h4><p>Each time The Payson Morning Scroll features a new merchant, that merchant is enrolled here under its trade. Hours and prices are as printed on the day featured; when in doubt, call ahead — even the finest ledger cannot chase a changed closing time.</p></div>';
      h += '</div>';
      h += '<p>The full editions live in <a href="' + ARCHIVE_URL + '">The Payson Morning Scroll archive</a> — every merchant\u2019s page links back to the very edition that honored them.</p>';
      h += '<p class="colophon">The Gilded Pages of the Holds \u00B7 Kept for the guests of Mogollon\u2019s Hearth \u00B7 Cured in pine smoke and copperleaf, against moth and mildew alike</p>';
      h += '</footer>';

      app.innerHTML = h;
    }

    function factRow(label, valueHtml, cls) {
      return '<div class="row' + (cls ? " " + cls : "") + '"><dt>' + esc(label) + '</dt><dd>' + valueHtml + '</dd></div>';
    }

    function renderVendor(v) {
      document.title = v.name + " — The Gilded Pages of the Holds";

      h += '<header class="vendor-head">';
      h += '<nav class="crumbs" aria-label="Directory path">';
      h += '<a href="#/">The Gilded Pages</a><span class="sep">\u203A</span>';
      h += '<a href="#cat-' + v.category + '">' + esc(cat) + '</a><span class="sep">\u203A</span>';
      h += '<span aria-current="page">' + esc(v.name) + '</span></nav>';
      h += '<p class="dir-small">The Gilded Pages of the Holds \u00B7 A Merchant Directory for the Guests of Mogollon\u2019s Hearth</p>';

      h += '<p class="meta-line">' + esc(cat) + ' \u00B7 ' + esc(v.town) + ' \u00B7 <a href="' + editionURL(v) + '">' + esc(scrollCite(v)) + '</a></p>';
      h += '</header>';

      h += '<main>';

      h += '<div>';
      h += '<blockquote class="review"><p class="rq">\u201C' + esc(v.review.text) + '\u201D</p>';
      h += '<p class="rs">— ' + esc(v.review.source);
      if (v.review.url) h += ' \u00B7 <a href="' + v.review.url + '" target="_blank" rel="noopener">read it at the source</a>';
      h += '</p></blockquote>';
      h += '</div>';

      h += '<div>';
      h += '<h2 class="sec-label">As the Scroll told it</h2>';
      h += '<p class="sec-cite">' + esc(scrollCite(v)) + ' — <a href="' + editionURL(v) + '">read that edition in the archive</a></p>';
      h += '<div class="blurb">';
      v.blurb.forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });

        if (v.ifYouGo) h += '<p class="if-you-go"><span class="iyg-label">If you go \u2014 </span>' + esc(v.ifYouGo) + '</p>';
        if (v.heraldrySrc && v.heraldrySrc.length) {
          h += '<p class="src">As heralded by ' + v.heraldrySrc.map(function (s) {
            return '<a href="' + s.url + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>';
          }).join(' \u00B7 ') + '</p>';
        }
        h += '</div>';
      }
      if (v.confession) {
        h += '<div class="confession"><span class="cf-label">The Scroll confesses \u2014 </span>' + esc(v.confession) + '</div>';
      }
      h += '<dl class="facts">';
      h += factRow("Trade", esc(cat) + " \u2014 " + esc(v.town));
      h += factRow("Address", esc(v.address));
      h += factRow("Phone", '<a href="tel:+1' + v.phone.replace(/[^0-9]/g, "") + '">' + esc(v.phone) + '</a>');
      h += factRow("Hours", esc(v.hours));
      h += factRow("Prices", esc(v.price));
      h += factRow("They offer", esc(v.offerings));
      h += factRow("Signature", esc(v.signature));
      h += factRow("Good to know", esc(v.goodToKnow));
      if (v.website) h += factRow("Website", '<a href="' + v.website + '" target="_blank" rel="noopener">' + esc(v.website.replace(/^https?:\/\//, "").replace(/\/$/, "")) + '</a>');

      h += factRow("In the Scroll", '<a href="' + editionURL(v) + '">' + esc(scrollCite(v)) + '</a>');
      h += '</dl>';
      h += '</div>';
      h += '</div></main>';

      h += '<footer class="trailer">';
      h += '<h3 class="tr-title">' + esc(v.name) + ' \u2014 the short of it, for the road</h3>';
      h += '<div class="trailer-grid">';
      h += '<div><h4>Find them</h4><ul>';
      h += '<li>' + esc(cat) + ' \u00B7 ' + esc(v.town) + '</li>';
      h += '<li>' + esc(v.address) + '</li>';
      h += '<li><a href="tel:+1' + v.phone.replace(/[^0-9]/g, "") + '">' + esc(v.phone) + '</a></li>';
      h += '<li>' + esc(v.hours) + '</li>';
      h += '<li>' + esc(v.price) + '</li>';
      h += '</ul></div>';
      h += '<div><h4>Word &amp; web</h4><ul>';
      if (v.website) h += '<li>Website: <a href="' + v.website + '" target="_blank" rel="noopener">' + esc(v.website.replace(/^https?:\/\//, "").replace(/\/$/, "")) + '</a></li>';
      h += '<li>Travelers\u2019 word: ' + esc(v.review.source) + (v.review.url ? ' \u00B7 <a href="' + v.review.url + '" target="_blank" rel="noopener">read the review</a>' : '') + '</li>';
      h += '<li>Signature: ' + esc(v.signature) + '</li>';
      h += '</ul></div>';
      h += '<div><h4>In the Scroll</h4><ul>';
      h += '<li><a href="' + editionURL(v) + '">' + esc(scrollCite(v)) + '</a></li>';
      h += '<li><a href="' + ARCHIVE_URL + '">The Payson Morning Scroll archive</a></li>';
      h += '</ul></div>';
      h += '</div>';
      h += '<a class="back-top" href="#cat-' + v.category + '">More ' + esc(cat) + '</a>';
      h += '<div class="back-page1-wrap"><a class="back-page1-btn" href="#/">\u21A9 Return to the First Page</a></div>';
      h += '<p class="colophon">The Gilded Pages of the Holds \u00B7 Kept for the guests of Mogollon\u2019s Hearth \u00B7 Hours and prices as printed in the Scroll on the day featured \u2014 call ahead if your road depends on them</p>';
      h += '</footer>';

      app.innerHTML = h;
    }

    function renderFiction(f) {

      h += '<div class="blurb">';

      h += '<div><h4>The ordering of it</h4><ul>';
      h += '<li>' + esc(f.order) + '</li>';
      h += '<li>House specialty: ' + esc(f.signature) + '</li>';
      h += '</ul></div>';
      h += '<div><h4>In the Scroll</h4><ul>';
      h += '<li>Never enrolled \u2014 and the Scroll has checked twice</li>';

      h += '<div class="back-page1-wrap"><a class="back-page1-btn" href="#/">\u21A9 Return to the First Page</a></div>';
      h += '<p class="colophon">The Gilded Pages of the Holds \u00B7 The back pages of pure jest \u00B7 Filed under Mail Order Skyrim, where the moths can\u2019t read and the ravens can</p>';
      h += '</footer>';

      app.innerHTML = h;

    function route() {
      var hash = window.location.hash || "#/";
      var fm = hash.match(/^#\/fiction\/([a-z0-9-]+)/);
      if (fm) {
        var f = fictionBySlug(fm[1]);
        if (f) { renderFiction(f); window.scrollTo(0, 0); return; }
      }
      if (hash === "#mail-order-skyrim") {
        renderIndex();
        var fel = document.getElementById("mail-order-skyrim");
        if (fel) { fel.scrollIntoView(); return; }
        window.scrollTo(0, 0);
        return;
      }
      var m = hash.match(/^#\/vendor\/([a-z0-9-]+)/);
      if (m) {
        var v = vendorBySlug(m[1]);
        if (v) { renderVendor(v); window.scrollTo(0, 0); return; }
      }
      if (hash.indexOf("#cat-") === 0) {
        renderIndex();
        var el = document.getElementById(hash.slice(1));
        if (el) { el.scrollIntoView(); return; }
        window.scrollTo(0, 0);
        return;
      }
      renderIndex();
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", route);
    route();

    /* The “Return to the First Page” buttons are plain #/ links, but a tap on
       one must always work — even when the address already ends in #/, where
       the click changes nothing and no hashchange fires. Catch the tap
       directly: go back to the directory and scroll to its very top. */
    document.addEventListener("click", function (e) {
      var t = e.target;
      while (t && t !== document) {
        if (t.classList && t.classList.contains("back-page1-btn")) {
          e.preventDefault();
          renderIndex();
          window.scrollTo(0, 0);
          return;
        }
        t = t.parentNode;
      }
    });
    </script>
